<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Saksham Pravesh MHT CET Counseling Platform</title>
  <meta name="description" content="Sign in to your Saksham Pravesh student or admin dashboard. Access counseling notices, meeting links, and admission resources.">
  <meta name="robots" content="noindex, nofollow">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light py-5 min-vh-100 d-flex align-items-center">

  <div class="container">
    <div class="row justify-content-center w-100 m-0">
      <div class="col-md-6 col-lg-4 p-0">
        
        <!-- Brand Link -->
        <div class="text-center mb-4">
          <a href="/" class="navbar-brand brand-font fs-2 fw-extrabold text-decoration-none d-flex align-items-center justify-content-center text-dark">
            <img src="/images/logo.png" alt="Logo" height="40" class="me-2" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%232563eb\'%3E%3Cpath d=\'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5\'/%3E%3C/svg%3E'">
            Saksham Pravesh
          </a>
        </div>

        <!-- Login Form -->
        <div class="bg-white p-5 rounded-4 border border-light shadow-sm">
          <h3 class="fw-bold text-center text-dark mb-2 brand-font">Welcome Back</h3>
          <p class="text-muted text-center small mb-4">Sign in to access your dashboard.</p>
          
          <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

          <form id="login-form" novalidate>
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label text-dark fw-medium small">Email Address</label>
              <input type="email" class="form-control bg-light border-light" id="email" required placeholder="e.g. name@domain.com">
            </div>

            <!-- Password -->
            <div class="mb-4">
              <label for="password" class="form-label text-dark fw-medium small">Password</label>
              <input type="password" class="form-control bg-light border-light" id="password" required placeholder="Enter password">
            </div>

            <!-- Submit button -->
            <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-2">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>

          <hr class="border-secondary opacity-25 my-4">
          <p class="text-center text-muted mb-0 small">
            New aspirant? <a href="/register" class="text-primary fw-bold text-decoration-none">Create Account</a>
          </p>
        </div>

        <!-- Back to Home Link -->
        <div class="text-center mt-4">
          <a href="/" class="text-muted text-decoration-none small hover-primary"><i class="bi bi-arrow-left me-1"></i> Back to Homepage</a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
