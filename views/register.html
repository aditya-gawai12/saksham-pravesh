<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Start Your MHT CET Counseling | Saksham Pravesh</title>
  <meta name="description" content="Register on Saksham Pravesh to get personalized MHT CET counseling. Choose Basic or Premium packages for expert guidance on Cap Rounds, Spot Rounds, and college preference lists.">
  <meta name="keywords" content="MHT CET registration, counseling signup, college admission help, Maharashtra engineering counseling">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sakshampravesh.com/register">
  <!-- Bootstrap 5.3 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gradient-hero py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <!-- Brand Link -->
        <div class="text-center mb-4">
          <a href="/" class="navbar-brand text-gradient fs-2 fw-extrabold text-decoration-none d-flex align-items-center justify-content-center">
            <img src="/images/logo.png" alt="Saksham Pravesh Logo" height="50" class="me-2">
            SAKSHAM PRAVESH
          </a>
        </div>

        <!-- Glass Card Registration Form -->
        <div class="glass-card p-5">
          <h3 class="fw-bold text-center text-light mb-2">Student Registration</h3>
          <p class="text-muted text-center small mb-4">Create your account to start Cap Option Form allocation counseling.</p>
          
          <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

          <form id="register-form" novalidate>
            <!-- Full Name -->
            <div class="mb-3">
              <label for="full_name" class="form-label">Full Name (As per MHT CET Admit Card)</label>
              <input type="text" class="form-control" id="full_name" required placeholder="e.g. Rahul Ramesh Patil">
            </div>

            <!-- Email & Phone in a Grid -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" required placeholder="e.g. rahul@gmail.com">
              </div>
              <div class="col-md-6 mb-3">
                <label for="phone_number" class="form-label">Phone Number (WhatsApp preferred)</label>
                <input type="tel" class="form-control" id="phone_number" required placeholder="e.g. 9876543210" pattern="[0-9]{10}">
              </div>
            </div>

            <!-- MHT CET Percentile, Category, Branch in a Grid -->
            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="mht_cet_percentile" class="form-label">MHT CET %ile</label>
                <input type="number" class="form-control" id="mht_cet_percentile" required min="0" max="100" step="0.01" placeholder="e.g. 91.24">
              </div>
              <div class="col-md-4 mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" required>
                  <option value="" disabled selected>Select</option>
                  <option value="General/Open">General / Open</option>
                  <option value="OBC">OBC</option>
                  <option value="SC">SC</option>
                  <option value="ST">ST</option>
                  <option value="VJ/NT">VJ / NT</option>
                  <option value="EWS">EWS</option>
                  <option value="TFWS">TFWS</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label for="preferred_branch" class="form-label">Preferred Branch</label>
                <select class="form-select" id="preferred_branch" required>
                  <option value="" disabled selected>Select</option>
                  <option value="Computer Engineering/CSE">Computer Science / CSE</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics & Telecommunication (ENTC)">ENTC</option>
                  <option value="Mechanical Engineering">Mechanical</option>
                  <option value="Electrical Engineering">Electrical</option>
                  <option value="Civil Engineering">Civil</option>
                  <option value="Chemical/Pharmacy/Other">Pharmacy / Other</option>
                </select>
              </div>
            </div>

            <!-- Package Selection -->
            <div class="mb-3">
              <label class="form-label">Select Counseling Package</label>
              <div class="row g-2">
                <div class="col-6">
                  <input type="radio" class="btn-check" name="selected_package" id="package-basic" value="basic" autocomplete="off" checked>
                  <label class="btn btn-outline-secondary w-100 p-3 text-start package-radio-label" for="package-basic">
                    <div class="fw-bold text-light"><i class="bi bi-box me-2"></i>Form Assist</div>
                    <small class="text-muted d-block mt-1">Basic Cap Round support</small>
                  </label>
                </div>
                <div class="col-6">
                  <input type="radio" class="btn-check" name="selected_package" id="package-premium" value="premium" autocomplete="off">
                  <label class="btn btn-outline-info w-100 p-3 text-start package-radio-label" for="package-premium">
                    <div class="fw-bold text-light"><i class="bi bi-stars me-2 text-info"></i>Premium</div>
                    <small class="text-muted d-block mt-1">Full end-to-end guidance</small>
                  </label>
                </div>
              </div>
              <small class="text-muted d-block mt-2"><i class="bi bi-info-circle me-1"></i>Contact our team for package pricing & payment details after registration.</small>
            </div>

            <!-- Passwords -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="Min 6 characters">
              </div>
              <div class="col-md-6 mb-4">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" required placeholder="Repeat password">
              </div>
            </div>

            <!-- Submit button -->
            <button type="submit" class="btn btn-primary-custom w-100 py-3 mt-2">
              <i class="bi bi-person-plus-fill me-2"></i>Register & Login
            </button>
          </form>

          <hr class="border-secondary opacity-25 my-4">
          <p class="text-center text-muted mb-0 small">
            Already have an account? <a href="/login" class="text-info fw-bold text-decoration-none">Sign In</a>
          </p>
        </div>

        <!-- Back to Home Link -->
        <div class="text-center mt-3">
          <a href="/" class="text-muted text-decoration-none small"><i class="bi bi-arrow-left me-1"></i> Back to Homepage</a>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Client JavaScript -->
  <script src="/js/main.js"></script>
</body>
</html>
