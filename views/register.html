<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Start Your MHT CET Counseling | Saksham Pravesh</title>
  <meta name="description" content="Register on Saksham Pravesh to get personalized MHT CET counseling. Choose Basic or Premium packages for expert guidance on Cap Rounds, Spot Rounds, and college preference lists.">
  <meta name="keywords" content="MHT CET registration, counseling signup, college admission help, Maharashtra engineering counseling">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sakshampravesh.com/register">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light py-5 min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8">
        
        <!-- Brand Link -->
        <div class="text-center mb-4">
          <a href="/" class="navbar-brand brand-font fs-2 fw-extrabold text-decoration-none d-flex align-items-center justify-content-center text-dark">
            <img src="/images/logo.png" alt="Logo" height="40" class="me-2" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%232563eb\'%3E%3Cpath d=\'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5\'/%3E%3C/svg%3E'">
            Saksham Pravesh
          </a>
        </div>

        <!-- Registration Form -->
        <div class="bg-white p-4 p-md-5 rounded-4 border border-light shadow-sm">
          <h3 class="fw-bold text-center text-dark mb-2 brand-font">Student Registration</h3>
          <p class="text-muted text-center small mb-4">Create your account to start Cap Option Form allocation counseling.</p>
          
          <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

          <form id="register-form" novalidate>
            <!-- Full Name -->
            <div class="mb-4">
              <label for="full_name" class="form-label text-dark fw-bold small">Full Name (As per Admit Card)</label>
              <input type="text" class="form-control bg-light border-light text-dark py-2" id="full_name" required placeholder="e.g. Rahul Ramesh Patil">
            </div>

            <!-- Email & Phone in a Grid -->
            <div class="row mb-2">
              <div class="col-md-6 mb-3">
                <label for="email" class="form-label text-dark fw-bold small">Email Address</label>
                <input type="email" class="form-control bg-light border-light text-dark py-2" id="email" required placeholder="e.g. rahul@gmail.com">
              </div>
              <div class="col-md-6 mb-3">
                <label for="phone_number" class="form-label text-dark fw-bold small">Phone Number (WhatsApp)</label>
                <input type="tel" class="form-control bg-light border-light text-dark py-2" id="phone_number" required placeholder="e.g. 9876543210" pattern="[0-9]{10}">
              </div>
            </div>

            <!-- MHT CET Percentile, Category, Branch in a Grid -->
            <div class="row mb-2">
              <div class="col-md-4 mb-3">
                <label for="mht_cet_percentile" class="form-label text-dark fw-bold small">MHT CET %ile</label>
                <input type="number" class="form-control bg-light border-light text-dark py-2" id="mht_cet_percentile" required min="0" max="100" step="0.01" placeholder="e.g. 91.24">
              </div>
              <div class="col-md-4 mb-3">
                <label for="category" class="form-label text-dark fw-bold small">Category</label>
                <select class="form-select bg-light border-light text-dark py-2" id="category" required>
                  <option value="" disabled selected>Select</option>
                  <option value="General/Open">General / Open</option>
                  <option value="OBC">OBC</option>
                  <option value="SC">SC</option>
                  <option value="ST">ST</option>
                  <option value="VJ/NT">VJ / NT</option>
                  <option value="EWS">EWS</option>
                  <option value="TFWS">TFWS</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label for="preferred_branch" class="form-label text-dark fw-bold small">Preferred Branch</label>
                <select class="form-select bg-light border-light text-dark py-2" id="preferred_branch" required>
                  <option value="" disabled selected>Select</option>
                  <option value="Computer Engineering/CSE">Computer Science / CSE</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics & Telecommunication (ENTC)">ENTC</option>
                  <option value="Mechanical Engineering">Mechanical</option>
                  <option value="Electrical Engineering">Electrical</option>
                  <option value="Civil Engineering">Civil</option>
                  <option value="Chemical/Pharmacy/Other">Pharmacy / Other</option>
                </select>
              </div>
            </div>

            <!-- Package Selection -->
            <div class="mb-4">
              <label class="form-label text-dark fw-bold small">Select Counseling Package</label>
              <div class="row g-3">
                <div class="col-md-4">
                  <input type="radio" class="btn-check" name="selected_package" id="package-exclusive" value="exclusive" autocomplete="off">
                  <label class="btn btn-outline-secondary w-100 p-3 text-start border bg-light h-100" for="package-exclusive" style="border-radius:12px;">
                    <div class="fw-bold text-dark mb-1"><i class="bi bi-pencil-square me-2"></i>Form Filling</div>
                    <small class="text-muted d-block">Cap Round preference filling</small>
                  </label>
                </div>
                <div class="col-md-4">
                  <input type="radio" class="btn-check" name="selected_package" id="package-basic" value="basic" autocomplete="off" checked>
                  <label class="btn btn-outline-secondary w-100 p-3 text-start border bg-light h-100" for="package-basic" style="border-radius:12px;">
                    <div class="fw-bold text-dark mb-1"><i class="bi bi-box me-2"></i>Form Assist</div>
                    <small class="text-muted d-block">Basic Cap Round support</small>
                  </label>
                </div>
                <div class="col-md-4">
                  <input type="radio" class="btn-check" name="selected_package" id="package-premium" value="premium" autocomplete="off">
                  <label class="btn btn-outline-primary w-100 p-3 text-start border bg-light h-100" for="package-premium" style="border-radius:12px;">
                    <div class="fw-bold text-primary mb-1"><i class="bi bi-stars me-2"></i>Premium</div>
                    <small class="text-muted d-block">Full end-to-end guidance</small>
                  </label>
                </div>
              </div>
              <small class="text-muted d-block mt-2" style="font-size:0.75rem;"><i class="bi bi-info-circle me-1 text-primary"></i>Contact our team for package pricing & payment details after registration.</small>
            </div>

            <!-- Passwords -->
            <div class="row mb-4">
              <div class="col-md-6 mb-3">
                <label for="password" class="form-label text-dark fw-bold small">Password</label>
                <input type="password" class="form-control bg-light border-light text-dark py-2" id="password" required placeholder="Min 6 characters">
              </div>
              <div class="col-md-6 mb-3">
                <label for="confirm_password" class="form-label text-dark fw-bold small">Confirm Password</label>
                <input type="password" class="form-control bg-light border-light text-dark py-2" id="confirm_password" required placeholder="Repeat password">
              </div>
            </div>

            <!-- Submit button -->
            <button type="submit" class="btn btn-primary-custom w-100 py-3 fw-bold fs-6">
              <i class="bi bi-person-plus-fill me-2"></i>Register & Login
            </button>
          </form>

          <hr class="border-secondary opacity-25 my-4">
          <p class="text-center text-muted mb-0 small">
            Already have an account? <a href="/login" class="text-primary fw-bold text-decoration-none">Sign In</a>
          </p>
        </div>

        <!-- Back to Home Link -->
        <div class="text-center mt-4 mb-4">
          <a href="/" class="text-muted text-decoration-none small hover-primary"><i class="bi bi-arrow-left me-1"></i> Back to Homepage</a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
